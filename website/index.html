<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Zhudiyo — An AI-native comic studio that amplifies the creator</title>
    <meta name="description" content="Zhudiyo, from CIL Studio. An AI-native comic studio that amplifies the creator. Humancode: keeping humans at the center of how the work is made and what it's about." />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Public+Sans:ital,wght@0,100..900;1,100..900&family=JetBrains+Mono:wght@100..800&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['"Public Sans"', 'system-ui', 'sans-serif'],
              mono: ['"JetBrains Mono"', 'monospace'],
            },
            colors: {
              // Zhudiyo brand system
              noir: {
                900: '#0F0F11', // canonical background
                800: '#141416',
                700: '#1B1B1E',
                border: '#2A2A2E',
                accent: '#F0EEE8',
              },
              ink: '#F0EEE8',
              brand: {
                purple: '#A855F7',
                yellow: '#EAB308',
              },
            }
          }
        }
      }
    </script>
    <style>
      /* Custom Scrollbar for Terminal Feel */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #0F0F11;
      }
      ::-webkit-scrollbar-thumb {
        background: #333; 
        border: 1px solid #000;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #555; 
      }
      .glitch-text {
        position: relative;
      }
      .grid-bg {
        background-size: 40px 40px;
        background-image:
          linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
          linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react/": "https://esm.sh/react@^19.2.3/",

    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "lucide-react": "https://esm.sh/lucide-react@^0.562.0",
    "recharts": "https://esm.sh/recharts@^3.6.0"
  }
}
</script>
</head>
  <body class="bg-noir-900 text-ink font-sans antialiased selection:bg-brand-purple selection:text-white">

</html>
